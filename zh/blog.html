<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>李想 | 博客</title>
  <meta name="description" content="李想的个人博客，分享生活与学习心得">
  <meta name="author" content="李想">
  <link rel="icon" href="../Resources/微信头像.jpg">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .blog-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 28px;
    }
    .blog-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .blog-header h1 {
      font-size: 36px;
      margin-bottom: 12px;
      color: #111827;
    }
    .blog-header p {
      color: #0b0b0b;
      font-size: 18px;
    }
    .blog-filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .filter-btn {
      padding: 8px 20px;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      background: #fff;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      border-color: #0f67ff;
      color: #0f67ff;
    }
    .filter-btn.active {
      background: #0f67ff;
      border-color: #0f67ff;
      color: #fff;
    }
    .blog-post {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .blog-post:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .blog-post.hidden {
      display: none;
    }
    .blog-meta {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      color: #0b0b0b;
      font-size: 14px;
    }
    .blog-category {
      display: inline-block;
      padding: 4px 10px;
      background: #f5f7fb;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .blog-title {
      font-size: 24px;
      margin-bottom: 12px;
      color: #111827;
    }
    .blog-excerpt {
      color: #0b0b0b;
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .blog-read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #0f67ff;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .blog-read-more:hover {
      color: #6a5cff;
    }

    @media (max-width: 768px) {
      .blog-container {
        padding: 24px 16px;
      }
      .blog-header h1 {
        font-size: 28px;
      }
      .blog-header p {
        font-size: 16px;
      }
      .blog-filters {
        flex-wrap: wrap;
        gap: 8px;
      }
      .filter-btn {
        padding: 6px 14px;
        font-size: 13px;
      }
      .blog-post {
        padding: 20px;
      }
      .blog-title {
        font-size: 20px;
      }
      .blog-excerpt {
        font-size: 15px;
      }
      .blog-meta {
        flex-wrap: wrap;
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .blog-header h1 {
        font-size: 24px;
      }
      .blog-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/zh/index.html" aria-label="首页">
      <span class="brand-name">李想</span>
    </a>
    <nav class="site-nav" aria-label="主要导航">
      <a href="/zh/index.html">个人主页</a>
      <a href="/zh/blog.html">博客</a>
      <a href="/zh/moments.html">朋友圈</a>
      <a href="/zh/about.html">关于我</a>
    </nav>
  </header>

  <main>
    <div class="blog-container">
      <div class="blog-header">
        <h1>我的博客</h1>
        <p>分享生活与学习心得</p>
      </div>

      <div class="blog-filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="随笔">随笔</button>
        <button class="filter-btn" data-filter="学习">学习</button>
        <button class="filter-btn" data-filter="生活">生活</button>
      </div>

      <div id="blog-posts"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© <span id="year">2025</span> 李想</span>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let posts = [];

    async function loadPosts() {
      try {
        const response = await fetch('../data/blog.json');
        posts = await response.json();
        posts.sort((a, b) => {
          if (a.pinned && !b.pinned) return -1;
          if (!a.pinned && b.pinned) return 1;
          return new Date(b.date) - new Date(a.date);
        });
        renderPosts();
      } catch (error) {
        console.error('加载博客失败:', error);
        document.getElementById('blog-posts').innerHTML = '<p style="text-align:center;color:#0b0b0b;">加载失败，请刷新重试</p>';
      }
    }

    const container = document.getElementById('blog-posts');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let currentFilter = 'all';

    function renderPosts() {
      const filteredPosts = currentFilter === 'all'
        ? posts
        : posts.filter(post => 
            (post.tags && post.tags.includes(currentFilter)) || 
            (post.categories && post.categories.includes(currentFilter))
          );

      if (filteredPosts.length > 0) {
        container.innerHTML = filteredPosts.map(post => {
          const date = new Date(post.date);
          const dateStr = date.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
          const fileName = post.file || post.title.toLowerCase().replace(/\s+/g, '-');
          const tag = post.tags[0] || post.categories[0] || '随笔';
          const pinBadge = post.pinned ? '<span style="color:#e74c3c;margin-right:6px;">📌</span>' : '';

          return `
            <article class="blog-post">
              <div class="blog-meta">
                <span>${dateStr}</span>
                <span class="blog-category">${tag}</span>
              </div>
              <h2 class="blog-title">${pinBadge}${post.title}</h2>
              <p class="blog-excerpt">${post.excerpt}</p>
              <a href="blog-post.html?p=${fileName}" class="blog-read-more">阅读更多 →</a>
            </article>
          `;
        }).join('');
      } else {
        container.innerHTML = '<p style="text-align:center;color:#0b0b0b;">暂无文章</p>';
      }
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderPosts();
      });
    });

    loadPosts();
  </script>
</body>
</html>
