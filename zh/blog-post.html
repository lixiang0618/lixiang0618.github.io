<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (isMobile) {
        const navLinks = document.querySelectorAll('.site-nav a');
        navLinks.forEach(link => {
          if (link.href.indexOf('index.html') !== -1) {
            link.href = 'index-mobile.html';
          }
        });
      }
    })();
  </script>
  <title id="post-title">博客文章</title>
  <meta name="description" content="博客文章">
  <link rel="icon" href="../Resources/微信头像.jpg">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .post-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 28px;
    }
    .post-header {
      margin-bottom: 40px;
    }
    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.2s ease;
    }
    .post-back:hover {
      color: var(--accent);
    }
    .post-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      color: var(--subtle);
      font-size: 14px;
    }
    .post-category {
      display: inline-block;
      padding: 4px 10px;
      background: var(--muted);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .post-title {
      font-size: 36px;
      margin-bottom: 12px;
      color: var(--text);
      line-height: 1.3;
    }
    .post-content {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      line-height: 1.8;
      color: var(--text);
    }
    .post-content h1, .post-content h2, .post-content h3 {
      margin-top: 32px;
      margin-bottom: 16px;
      color: var(--text);
    }
    .post-content h2 {
      font-size: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .post-content p {
      margin-bottom: 16px;
    }
    .post-content ul, .post-content ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }
    .post-content li {
      margin-bottom: 8px;
    }
    .post-content code {
      background: var(--muted);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .post-content pre {
      background: var(--muted);
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    .post-content pre code {
      background: none;
      padding: 0;
    }
    .post-content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 16px 0;
    }
    .post-content blockquote {
      border-left: 4px solid var(--primary);
      padding-left: 16px;
      margin: 16px 0;
      color: var(--subtle);
    }
    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
    }
    .post-tag {
      padding: 4px 10px;
      background: rgba(15, 103, 255, 0.08);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
    }
    .post-pdf {
      margin-top: 24px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .post-pdf-header {
      padding: 12px 16px;
      background: var(--muted);
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .post-pdf iframe {
      width: 100%;
      height: 800px;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .post-container {
        padding: 24px 16px;
      }
      .post-header {
        margin-bottom: 24px;
      }
      .post-title {
        font-size: 26px;
      }
      .post-content {
        padding: 24px;
      }
      .post-content h2 {
        font-size: 20px;
      }
    }

    @media (max-width: 480px) {
      .post-title {
        font-size: 22px;
      }
      .post-content {
        padding: 18px;
      }
      .post-meta {
        flex-wrap: wrap;
        gap: 12px;
      }
      .post-pdf iframe {
        height: 500px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/zh/index.html" aria-label="Home">
      <span class="brand-name">李想</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/zh/index.html">首页</a>
      <a href="/zh/blog.html">博客</a>
      <a href="/zh/moments.html">朋友圈</a>
      <a href="/zh/about.html">关于我</a>
    </nav>
  </header>

  <main>
    <div class="post-container">
      <a href="/zh/blog.html" class="post-back">← 返回博客</a>

      <div class="post-header">
        <div class="post-meta">
          <span id="post-date"></span>
          <span id="post-category" class="post-category"></span>
        </div>
        <h1 id="post-title-text" class="post-title"></h1>
      </div>

      <article id="post-content" class="post-content"></article>

      <div id="post-pdf" class="post-pdf"></div>

      <div id="post-tags" class="post-tags"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© <span id="year">2025</span> XIANG LI</span>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const params = new URLSearchParams(window.location.search);
    const postFile = params.get('p');

    function parseMarkdown(text) {
      // 先用占位符保护代码块
      const codeBlocks = [];
      let html = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const placeholder = 'CODEBLOCK_PLACEHOLDER_' + codeBlocks.length + '_END';
        codeBlocks.push('<pre><code class="language-' + lang + '">' + code.trim() + '</code></pre>');
        return placeholder;
      });

      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="../blogs/$2" alt="$1">');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

      html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

      html = html.replace(/\n\n/g, '</p><p>');
      html = '<p>' + html + '</p>';
      html = html.replace(/<p><h/g, '<h');
      html = html.replace(/<\/h(\d)><\/p>/g, '</h$1>');
      html = html.replace(/<p><ul>/g, '<ul>');
      html = html.replace(/<\/ul><\/p>/g, '</ul>');
      html = html.replace(/<p><blockquote>/g, '<blockquote>');
      html = html.replace(/<\/blockquote><\/p>/g, '</blockquote>');
      html = html.replace(/<p><\/p>/g, '');

      // 恢复代码块
      codeBlocks.forEach((block, i) => {
        html = html.replace('CODEBLOCK_PLACEHOLDER_' + i + '_END', block);
      });

      return html;
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    async function loadPost() {
      if (!postFile) {
        document.getElementById('post-content').innerHTML = '<p>文章未找到。</p>';
        return;
      }

      try {
        const encodedFile = encodeURIComponent(postFile);
        const response = await fetch('../blogs/' + encodedFile + '.md');
        if (!response.ok) {
          document.getElementById('post-content').innerHTML = '<p>文章未找到。</p>';
          return;
        }

        const content = await response.text();
        const lines = content.split('\n');
        let frontMatter = {};
        let body = content;

        if (lines[0] === '---' || lines[0].trim() === '---') {
          let endIdx = -1;
          for (let i = 1; i < lines.length; i++) {
            if (lines[i] === '---' || lines[i].trim() === '---') {
              endIdx = i;
              break;
            }
          }
          if (endIdx > 0) {
            const yamlStr = lines.slice(1, endIdx).join('\n');
            let currentKey = '';
            yamlStr.split('\n').forEach(line => {
              const match = line.match(/^(\w+):\s*(.*)$/);
              if (match) {
                currentKey = match[1];
                if (match[2].startsWith('-')) {
                  frontMatter[currentKey] = [match[2].replace(/^\s*-\s*/, '').trim()];
                } else if (match[2].trim() === '') {
                  frontMatter[currentKey] = [];
                } else {
                  frontMatter[currentKey] = match[2];
                }
              } else if (currentKey && line.trim().startsWith('-')) {
                if (!Array.isArray(frontMatter[currentKey])) {
                  frontMatter[currentKey] = [];
                }
                frontMatter[currentKey].push(line.trim().replace(/^\s*-\s*/, ''));
              }
            });
            body = lines.slice(endIdx + 1).join('\n');
          }
        }

        document.getElementById('post-title').textContent = (frontMatter.title || postFile) + ' | 李想';
        document.getElementById('post-title-text').textContent = frontMatter.title || postFile;
        document.getElementById('post-date').textContent = formatDate(frontMatter.date || '2026-01-01');
        document.getElementById('post-category').textContent = frontMatter.categories || '未分类';
        document.getElementById('post-content').innerHTML = parseMarkdown(body);

        const tagsContainer = document.getElementById('post-tags');
        if (frontMatter.tags && Array.isArray(frontMatter.tags)) {
          tagsContainer.innerHTML = frontMatter.tags.map(tag => `<span class="post-tag">${tag}</span>`).join('');
        }

        const pdfContainer = document.getElementById('post-pdf');
        if (frontMatter.pdf) {
          const encodedPdf = encodeURIComponent(frontMatter.pdf);
          pdfContainer.innerHTML = `
            <div class="post-pdf-header">
              <span>📄</span>
              <span>附件: ${frontMatter.pdf}</span>
            </div>
            <iframe src="../blogs/${encodedPdf}" title="PDF 文档"></iframe>
          `;
        }
      } catch (error) {
        console.error('加载文章出错:', error);
        document.getElementById('post-content').innerHTML = '<p>加载文章出错。</p>';
      }
    }

    loadPost();
  </script>
</body>
</html>
