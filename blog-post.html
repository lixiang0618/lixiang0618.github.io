<!doctype html>
<html class="blog-document" lang="en">
<head>
  <meta charset="utf-8">
  <script src="js/blog-theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (isMobile) {
        const navLinks = document.querySelectorAll('.site-nav a');
        navLinks.forEach(link => {
          if (link.href.indexOf('index.html') !== -1) {
            link.href = 'index-mobile.html';
          }
        });
      }
    })();
  </script>
  <title id="post-title">Blog Post</title>
  <meta name="description" content="Blog post">
  <link rel="icon" href="Resources/微信头像.jpg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .post-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 28px;
    }
    .post-header {
      margin-bottom: 40px;
    }
    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.2s ease;
    }
    .post-back:hover {
      color: var(--accent);
    }
    .post-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      color: var(--subtle);
      font-size: 14px;
    }
    .post-category {
      display: inline-block;
      padding: 4px 10px;
      background: var(--muted);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .post-title {
      font-size: 36px;
      margin-bottom: 12px;
      color: var(--text);
      line-height: 1.3;
    }
    .post-content {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      line-height: 1.8;
      color: var(--text);
    }
    .post-content h1, .post-content h2, .post-content h3 {
      margin-top: 32px;
      margin-bottom: 16px;
      color: var(--text);
    }
    .post-content h2 {
      font-size: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .post-content p {
      margin-bottom: 16px;
    }
    .post-content ul, .post-content ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }
    .post-content li {
      margin-bottom: 8px;
    }
    .post-content code {
      background: var(--muted);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .post-content pre {
      background: var(--muted);
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    .post-content pre code {
      background: none;
      padding: 0;
    }
    .post-content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 16px 0;
    }
    .post-content blockquote {
      border-left: 4px solid var(--primary);
      padding-left: 16px;
      margin: 16px 0;
      color: var(--subtle);
    }
    .post-pdf {
      margin-top: 24px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .post-pdf-header {
      padding: 12px 16px;
      background: var(--muted);
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .post-pdf iframe {
      width: 100%;
      height: 800px;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .post-container {
        padding: 24px 16px;
      }
      .post-header {
        margin-bottom: 24px;
      }
      .post-title {
        font-size: 26px;
      }
      .post-content {
        padding: 24px;
      }
      .post-content h2 {
        font-size: 20px;
      }
    }

    @media (max-width: 480px) {
      .post-title {
        font-size: 22px;
      }
      .post-content {
        padding: 18px;
      }
      .post-meta {
        flex-wrap: wrap;
        gap: 12px;
      }
      .post-pdf iframe {
        height: 500px;
      }
    }
  </style>
  <link rel="stylesheet" href="js/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="blog.css">
  <link rel="stylesheet" href="404.css">
  <link rel="stylesheet" href="/assets/branding/branding.css">
</head>
<body class="blog-page">
  <header class="site-header">
    <a class="brand" href="/index.html" aria-label="Xiangology — Home"><img class="site-brand-logo" src="/assets/branding/xiangology.svg" alt="Xiangology" width="168" height="42"></a>
    <nav class="site-nav" aria-label="Primary">
      <a href="index.html">Profile</a>
      <a href="/lab.html">Lab <span class="nav-beta">Beta</span></a>
      <a href="blog.html">Blog</a>
      <a href="moments.html">Moments</a>
      <a href="about.html">About Me</a>
    </nav>
  </header>

  <main class="reading-layout">
    <aside class="reading-toc-slot"></aside>
    <div class="post-container">
      <a href="blog.html" class="post-back">← Back to Blog</a>

      <div class="post-header">
        <div class="post-meta">
          <span id="post-date"></span>
          <span id="post-category" class="post-category"></span>
        </div>
        <h1 id="post-title-text" class="post-title"></h1>
      </div>

      <div class="reading-mobile-controls"></div>
      <article id="post-content" class="post-content"></article>

      <div id="post-pdf" class="post-pdf"></div>

    </div>
    <aside class="reading-tools-slot"></aside>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© <span id="year">2025</span> XIANG LI</span>
    </div>
  </footer>

  <script src="js/moments-likes.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/blog-comments.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/blog-reading.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/vendor/marked.js"></script>
  <script src="js/vendor/katex/katex.min.js"></script>
  <script src="js/blog-markdown.js"></script>
  <script src="js/404.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const params = new URLSearchParams(window.location.search);
    const postFile = params.get('p');

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    async function loadPost() {
      if (!postFile) {
        document.dispatchEvent(new Event('site:not-found'));
        return;
      }

      try {
        const metadataResponse=await fetch('data/blog.json');
        if(!metadataResponse.ok) throw Error('metadata');
        const metadata=await metadataResponse.json();
        const post=metadata.find(p=>p.file===postFile);
        if(!post) { document.dispatchEvent(new Event('site:not-found')); return; }
        const encodedFile = encodeURIComponent(post.file);
        const response = await fetch('./blogs/' + encodedFile + '.md');
        if (response.status === 404) {
          document.dispatchEvent(new Event('site:not-found'));
          return;
        }
        if (!response.ok) throw Error('Article HTTP ' + response.status);

        const content = await response.text();
        const {frontMatter,body} = BlogMarkdown.parseDocument(content);

        document.getElementById('post-title').textContent = post.title + ' | Li Xiang';
        document.getElementById('post-title-text').textContent = post.title;
        document.getElementById('post-date').textContent = formatDate(post.date);
        document.getElementById('post-category').textContent = BlogUI.category(post);
        document.getElementById('post-content').innerHTML = BlogMarkdown.render(body, new URL('./blogs/' + encodedFile + '.md', location.href));

        BlogUI.renderPDF(document.getElementById('post-pdf'),frontMatter.pdf);
        BlogUI.mountArticle(post);
      } catch (error) {
        console.error('Error loading post:', error);
        document.getElementById('post-content').innerHTML = '<p>Error loading post.</p>';
      }
    }

    loadPost();
  </script>
</body>
</html>
