<!doctype html>
<html class="blog-document" lang="en">
<head>
  <meta charset="utf-8">
  <script src="js/blog-theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (isMobile) {
        const navLinks = document.querySelectorAll('.site-nav a');
        navLinks.forEach(link => {
          if (link.href.indexOf('index.html') !== -1) {
            link.href = 'index-mobile.html';
          }
        });
      }
    })();
  </script>
  <title>Li Xiang | Blog</title>
  <meta name="description" content="Li Xiang's Blog - Thoughts on my life and learning journey">
  <meta name="author" content="Li Xiang">
  <link rel="icon" href="Resources/微信头像.jpg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="blog.css">
</head>
<body class="blog-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Home">
      <span class="brand-name">Li Xiang</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="index.html">Profile</a>
      <a href="blog.html">Blog</a>
      <a href="moments.html">Moments</a>
      <a href="about.html">About Me</a>
    </nav>
  </header>

  <main>
    <div class="blog-container">
      <div class="blog-header">
        <h1>My Blog</h1>
      </div>

      <div class="blog-filters" aria-label="Categories"></div>

      <div id="blog-posts"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© <span id="year">2025</span> XIANG LI</span>
    </div>
  </footer>

  <script src="js/moments-likes.js"></script>
  <script src="js/blog.js"></script>
</body>
